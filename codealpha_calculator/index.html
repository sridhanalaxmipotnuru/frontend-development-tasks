<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CodeAlpha Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator-container">

        <h1>Calculator</h1>

        <div class="calculator">

            <!-- Display -->
            <div class="display">
                <input
                    type="text"
                    id="display"
                    value="0"
                    readonly
                >
            </div>

            <!-- Calculator Buttons -->
            <div class="buttons">

                <button class="clear"
                        onclick="clearDisplay()">
                    AC
                </button>

                <button class="operator"
                        onclick="deleteLast()">
                    DEL
                </button>

                <button class="operator"
                        onclick="appendOperator('%')">
                    %
                </button>

                <button class="operator"
                        onclick="appendOperator('/')">
                    ÷
                </button>


                <button onclick="appendNumber('7')">
                    7
                </button>

                <button onclick="appendNumber('8')">
                    8
                </button>

                <button onclick="appendNumber('9')">
                    9
                </button>

                <button class="operator"
                        onclick="appendOperator('*')">
                    ×
                </button>


                <button onclick="appendNumber('4')">
                    4
                </button>

                <button onclick="appendNumber('5')">
                    5
                </button>

                <button onclick="appendNumber('6')">
                    6
                </button>

                <button class="operator"
                        onclick="appendOperator('-')">
                    −
                </button>


                <button onclick="appendNumber('1')">
                    1
                </button>

                <button onclick="appendNumber('2')">
                    2
                </button>

                <button onclick="appendNumber('3')">
                    3
                </button>

                <button class="operator"
                        onclick="appendOperator('+')">
                    +
                </button>


                <button class="zero"
                        onclick="appendNumber('0')">
                    0
                </button>

                <button onclick="appendNumber('.')">
                    .
                </button>

                <button class="equals"
                        onclick="calculateResult()">
                    =
                </button>

            </div>

        </div>

        <p class="footer-text">
            CodeAlpha Frontend Development Task 2
        </p>

    </div>


    <script src="script.js"></script>

</body>

</html>
