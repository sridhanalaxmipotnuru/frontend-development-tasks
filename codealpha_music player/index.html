
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeAlpha Music Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="music-player">

        <h1>🎵 Music Player</h1>

        <div class="album">
            <div class="music-icon">🎵</div>
        </div>

        <h2 id="song-title">Song 1</h2>
        <p id="artist">My Favorite Song</p>

        <audio id="audio"></audio>

        <div class="progress-container">
            <input
                type="range"
                id="progress"
                value="0"
                min="0"
                max="100">
        </div>

        <div class="time">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">

            <button id="prev">⏮</button>

            <button id="play">▶</button>

            <button id="next">⏭</button>

        </div>

        <div class="volume">

            <span>🔊</span>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="1">

        </div>

       <div class="playlist">

    <button class="song active" data-index="0">
        🎵 Song 1
    </button>

    <button class="song" data-index="1">
        🎵 Song 2
    </button>

    <button class="song" data-index="2">
        🎵 Song 3
    </button>

    <button class="song" data-index="3">
        🎵 Song 4
    </button>

    <button class="song" data-index="4">
        🎵 Song 5
    </button>

    <button class="song" data-index="5">
        🎵 Song 6
    </button>

</div>

        <p class="footer">
            CodeAlpha Frontend Development Task 4
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
